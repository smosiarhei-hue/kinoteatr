name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Bump version
        run: |
          COMMITS=$(git rev-list --count HEAD)
          VERSION="1.0.$COMMITS"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Kinoteatr/Support/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $COMMITS" Kinoteatr/Support/Info.plist
          echo "Version set to $VERSION (build $COMMITS)"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project Kinoteatr.xcodeproj \
            -scheme Kinoteatr \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -qr Kinoteatr-unsigned.ipa Payload
          rm -rf Payload

      - name: Install zsign
        run: |
          curl -sSL -o zsign.zip https://github.com/zhlynn/zsign/releases/download/v1.1.1/zsign-macos-arm64.tar.gz
          tar -xzf zsign.zip
          sudo mv zsign /usr/local/bin/zsign

      - name: Sign IPA
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_PROFILE: ${{ secrets.APPLE_PROFILE }}
        run: |
          echo "$APPLE_CERT_P12" | base64 -d > cert.p12
          echo "$APPLE_PROFILE" | base64 -d > dev.mobileprovision
          zsign -k cert.p12 -p "$APPLE_CERT_PASSWORD" -m dev.mobileprovision \
            -b "app.hare5681.lyra4838" \
            -o Kinoteatr-signed.ipa Kinoteatr-unsigned.ipa
          rm -f cert.p12 dev.mobileprovision

      - uses: actions/upload-artifact@v4
        with:
          name: Kinoteatr-unsigned.ipa
          path: Kinoteatr-unsigned.ipa

      - uses: actions/upload-artifact@v4
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
        with:
          name: Kinoteatr-signed.ipa
          path: Kinoteatr-signed.ipa