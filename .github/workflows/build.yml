name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project Kinoteatr.xcodeproj \
            -scheme Kinoteatr \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -qr Kinoteatr.ipa Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Kinoteatr.ipa
          path: Kinoteatr.ipa
